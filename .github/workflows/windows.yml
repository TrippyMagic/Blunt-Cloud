name: Windows desktop
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra desktop --extra build
      - run: uv run --no-sync python -m unittest discover -s tests -v
      - shell: pwsh
        run: ./packaging/build.ps1
      - shell: pwsh
        run: |
          ./dist/BluntCloud/BluntCloud.exe --cli --help
          & "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe" packaging/installer.iss
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        with:
          name: BluntCloud-Windows-x64
          path: dist/BluntCloud-Setup.exe
